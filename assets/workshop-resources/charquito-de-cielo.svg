<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754"><rect width="1240" height="1754" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172b52}.title{font-size:48px;font-weight:700}.body{font-size:30px}.small{font-size:23px}</style><text x="80" y="105" class="title">Charquito de cielo</text><text x="80" y="155" class="small">Ayni Aula · Recurso para explorar y conversar</text><text x="80" y="220" font-size="28">Un poema original Ayni para leer en compañía.</text><rect x="80" y="290" width="1080" height="1050" rx="20" fill="#edf7fa"/><text x="135" y="400" font-size="43">En un charquito del patio</text><text x="135" y="457" font-size="43">cabe un pedazo de cielo.</text><text x="135" y="514" font-size="43">Pasa una nube despacio,</text><text x="135" y="571" font-size="43">se mira y sigue su vuelo.</text><text x="135" y="628" font-size="43"></text><text x="135" y="685" font-size="43">Llega una gota pequeña,</text><text x="135" y="742" font-size="43">se dibujan redondeles.</text><text x="135" y="799" font-size="43">El cielo se mueve un poco</text><text x="135" y="856" font-size="43">y vuelve a quedarse quieto.</text><ellipse cx="620" cy="1220" rx="370" ry="65" fill="#b9e7ef"/><ellipse cx="620" cy="1220" rx="160" ry="28" fill="none" stroke="#087d96" stroke-width="5"/><ellipse cx="620" cy="1220" rx="260" ry="46" fill="none" stroke="#087d96" stroke-width="4"/><text x="80" y="1440" font-size="30">¿Qué parte quieres volver a escuchar?</text><text x="80" y="1484" font-size="30">Mira el texto y la imagen. Puedes señalar, comentar o dibujar tu idea.</text><text x="80" y="1585" font-size="24">Para la docente: no pedir memorización ni respuestas únicas.</text><text x="80" y="1623" font-size="24">Una interpretación se conversa volviendo a una pista del poema.</text><text x="80" y="1690" class="small">Recurso original Ayni · La ficha acompaña el juego; no reemplaza la experiencia.</text></svg>