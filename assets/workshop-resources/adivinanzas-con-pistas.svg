<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754"><rect width="1240" height="1754" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172b52}.title{font-size:48px;font-weight:700}.body{font-size:30px}.small{font-size:23px}</style><text x="80" y="105" class="title">Adivinanzas con pistas</text><text x="80" y="155" class="small">Ayni Aula · Recurso para explorar y conversar</text><text x="80" y="220" font-size="28">Escucha, mira y cuenta qué pista te ayuda a pensar.</text><rect x="80" y="285" width="1080" height="275" rx="18" fill="#fff8e7"/><text x="115" y="350" font-size="31">Ruedo por el suelo.</text><text x="115" y="395" font-size="31">Con tus manos me puedes enviar.</text><text x="115" y="440" font-size="31">¿Quién soy?</text><circle cx="1020" cy="405" r="68" fill="#e7bd4d" stroke="#172b52" stroke-width="5"/><path d="M952 405h136m-68-68v136" stroke="#172b52" stroke-width="4"/><rect x="80" y="585" width="1080" height="275" rx="18" fill="#f5effc"/><text x="115" y="650" font-size="31">Al abrirme hay páginas.</text><text x="115" y="695" font-size="31">Cuentos y pistas puedo guardar.</text><text x="115" y="740" font-size="31">¿Quién soy?</text><path d="M920 650q50-20 100 0q50-20 100 0v125q-50-20-100 0q-50-20-100 0Z M1020 650v125" fill="white" stroke="#087d96" stroke-width="5"/><rect x="80" y="885" width="1080" height="275" rx="18" fill="#eef8f2"/><text x="115" y="950" font-size="31">Salgo de día en el cielo.</text><text x="115" y="995" font-size="31">Doy luz; no me debes mirar.</text><text x="115" y="1040" font-size="31">¿Quién soy?</text><circle cx="1020" cy="1010" r="48" fill="#e7bd4d"/><path d="M1082 1010l20 0" stroke="#b07911" stroke-width="6"/><path d="M1063.8406204335658 1053.8406204335658l14.142135623730951 14.14213562373095" stroke="#b07911" stroke-width="6"/><path d="M1020 1072l1.2246467991473533e-15 20" stroke="#b07911" stroke-width="6"/><path d="M976.159379566434 1053.8406204335658l-14.14213562373095 14.142135623730951" stroke="#b07911" stroke-width="6"/><path d="M958 1010l-20 2.4492935982947065e-15" stroke="#b07911" stroke-width="6"/><path d="M976.159379566434 966.159379566434l-14.142135623730955 -14.14213562373095" stroke="#b07911" stroke-width="6"/><path d="M1020 948l-3.673940397442059e-15 -20" stroke="#b07911" stroke-width="6"/><path d="M1063.8406204335658 966.159379566434l14.142135623730947 -14.142135623730955" stroke="#b07911" stroke-width="6"/><rect x="80" y="1185" width="1080" height="275" rx="18" fill="#edf7fa"/><text x="115" y="1250" font-size="31">De noche puedo asomarme.</text><text x="115" y="1295" font-size="31">A veces parezco una sonrisa.</text><text x="115" y="1340" font-size="31">¿Quién soy?</text><circle cx="1020" cy="1310" r="70" fill="#e7bd4d"/><circle cx="1053" cy="1281" r="64" fill="#edf7fa"/><text x="80" y="1585" font-size="24">Para la docente: las respuestas se pueden cubrir con papel si el grupo lo desea.</text><text x="80" y="1623" font-size="24">Relean y comparen pistas sin competir por adivinar más rápido.</text><text x="80" y="1690" class="small">Recurso original Ayni · La ficha acompaña el juego; no reemplaza la experiencia.</text></svg>