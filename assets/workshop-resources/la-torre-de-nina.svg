<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754"><rect width="1240" height="1754" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172b52}.title{font-size:48px;font-weight:700}.body{font-size:30px}.small{font-size:23px}</style><text x="80" y="105" class="title">La torre de Nina</text><text x="80" y="155" class="small">Ayni Aula · Recurso para explorar y conversar</text><text x="80" y="215" font-size="27">Un cuento original Ayni para mirar y leer en compañía.</text><rect x="80" y="280" width="1080" height="385" rx="18" fill="#edf7fa"/><text x="115" y="340" font-size="28" font-weight="700">1</text><text x="115" y="405" font-size="30">Nina quería una torre para su muñeco.</text><text x="115" y="449" font-size="30">Puso bloques uno sobre otro.</text><text x="115" y="493" font-size="30">—¿Podrá sostener uno más? —preguntó.</text><rect x="1000" y="540" width="60" height="60" rx="3" fill="#087d96"/><rect x="1000" y="480" width="60" height="60" rx="3" fill="#e3a22e"/><rect x="1000" y="420" width="60" height="60" rx="3" fill="#8263b7"/><rect x="80" y="705" width="1080" height="385" rx="18" fill="#fff8e7"/><text x="115" y="765" font-size="28" font-weight="700">2</text><text x="115" y="830" font-size="30">Al poner otra pieza, la torre cayó.</text><text x="115" y="874" font-size="30">Nina miró la base estrecha.</text><text x="115" y="918" font-size="30">—Probaré de otra manera —decidió.</text><rect x="945" y="965" width="65" height="60" rx="3" fill="#087d96"/><rect x="1020" y="970" width="65" height="55" rx="3" fill="#e3a22e"/><rect x="1060" y="895" width="55" height="60" rx="3" fill="#8263b7"/><rect x="80" y="1130" width="1080" height="385" rx="18" fill="#eef8f2"/><text x="115" y="1190" font-size="28" font-weight="700">3</text><text x="115" y="1255" font-size="30">Puso piezas anchas abajo y otras encima.</text><text x="115" y="1299" font-size="30">La nueva torre se mantuvo en su lugar.</text><text x="115" y="1343" font-size="30">Nina volvió a mirar y sonrió.</text><text x="115" y="1387" font-size="30">¿Qué cambió en su construcción?</text><rect x="950" y="1390" width="160" height="60" rx="3" fill="#087d96"/><rect x="975" y="1330" width="110" height="60" rx="3" fill="#e3a22e"/><rect x="1000" y="1270" width="60" height="60" rx="3" fill="#8263b7"/><text x="80" y="1595" font-size="24">Para la docente: no adelantes el desenlace; vuelvan al texto y a las imágenes.</text><text x="80" y="1633" font-size="24">Se puede anticipar, señalar, comentar y cambiar de interpretación.</text><text x="80" y="1690" class="small">Recurso original Ayni · La ficha acompaña el juego; no reemplaza la experiencia.</text></svg>