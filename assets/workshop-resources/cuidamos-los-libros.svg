<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754"><rect width="1240" height="1754" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172b52}.title{font-size:48px;font-weight:700}.body{font-size:30px}.small{font-size:23px}</style><text x="80" y="105" class="title">Cuidamos los libros</text><text x="80" y="155" class="small">Ayni Aula · Recurso para explorar y conversar</text><text x="80" y="220" font-size="28">Una guía para consultar en nuestra biblioteca.</text><rect x="80" y="285" width="1080" height="285" rx="18" fill="#edf7fa"/><circle cx="150" cy="350" r="30" fill="#087d96"/><text x="140" y="361" style="fill:white;font-size:30px;font-weight:bold">1</text><text x="210" y="360" font-size="29">Manos limpias y secas.</text><text x="210" y="403" font-size="29">Antes de elegir un libro, miramos nuestras manos.</text><path d="M500 440q65-20 130 0q65-20 130 0v90q-65-20-130 0q-65-20-130 0Z M630 440v90" fill="white" stroke="#087d96" stroke-width="5"/><path d="M520 467h80m-80 24h80m50-24h80m-80 24h80" fill="none" stroke="#a6bcd1" stroke-width="4"/><rect x="80" y="605" width="1080" height="285" rx="18" fill="#eef8f2"/><circle cx="150" cy="670" r="30" fill="#087d96"/><text x="140" y="681" style="fill:white;font-size:30px;font-weight:bold">2</text><text x="210" y="680" font-size="29">Abrimos el libro con cuidado.</text><text x="210" y="723" font-size="29">Lo apoyamos sobre una mesa o en nuestro regazo.</text><path d="M500 760q65-20 130 0q65-20 130 0v90q-65-20-130 0q-65-20-130 0Z M630 760v90" fill="white" stroke="#087d96" stroke-width="5"/><path d="M520 787h80m-80 24h80m50-24h80m-80 24h80" fill="none" stroke="#a6bcd1" stroke-width="4"/><rect x="80" y="925" width="1080" height="285" rx="18" fill="#fff8e7"/><circle cx="150" cy="990" r="30" fill="#087d96"/><text x="140" y="1001" style="fill:white;font-size:30px;font-weight:bold">3</text><text x="210" y="1000" font-size="29">Pasamos una página a la vez.</text><text x="210" y="1043" font-size="29">Tomamos la esquina suavemente, sin tirar.</text><path d="M500 1080q65-20 130 0q65-20 130 0v90q-65-20-130 0q-65-20-130 0Z M630 1080v90" fill="white" stroke="#087d96" stroke-width="5"/><path d="M520 1107h80m-80 24h80m50-24h80m-80 24h80" fill="none" stroke="#a6bcd1" stroke-width="4"/><rect x="80" y="1245" width="1080" height="285" rx="18" fill="#f5effc"/><circle cx="150" cy="1310" r="30" fill="#087d96"/><text x="140" y="1321" style="fill:white;font-size:30px;font-weight:bold">4</text><text x="210" y="1320" font-size="29">Lo devolvemos a su lugar.</text><text x="210" y="1363" font-size="29">Así otra persona podrá encontrarlo.</text><path d="M500 1400q65-20 130 0q65-20 130 0v90q-65-20-130 0q-65-20-130 0Z M630 1400v90" fill="white" stroke="#087d96" stroke-width="5"/><path d="M520 1427h80m-80 24h80m50-24h80m-80 24h80" fill="none" stroke="#a6bcd1" stroke-width="4"/><text x="80" y="1625" font-size="24">Para la docente: lean juntos y busquen pistas en palabras, dibujos y números.</text><text x="80" y="1690" class="small">Recurso original Ayni · La ficha acompaña el juego; no reemplaza la experiencia.</text></svg>