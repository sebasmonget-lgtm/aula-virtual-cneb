<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754"><rect width="1240" height="1754" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172b52}.title{font-size:48px;font-weight:700}.body{font-size:30px}.small{font-size:23px}</style><text x="80" y="105" class="title">Pintamos con agua</text><text x="80" y="155" class="small">Ayni Aula · Recurso para explorar y conversar</text><text x="80" y="220" font-size="27">Un instructivo original Ayni para consultar antes y durante el juego.</text><rect x="80" y="285" width="1080" height="280" rx="18" fill="#edf7fa"/><circle cx="140" cy="345" r="30" fill="#087d96"/><text x="130" y="355" style="fill:white;font-size:28px">1</text><text x="195" y="350" font-size="28">Reunimos lo necesario.</text><text x="195" y="392" font-size="28">Poca agua limpia, una brocha, cartón oscuro y una toalla.</text><path d="M850 425h110l-10 90h-90Z" fill="white" stroke="#087d96" stroke-width="4"/><path d="M858 465h94l-6 45h-82Z" fill="#b9e7ef"/><path d="M1020 415v70" stroke="#a06e42" stroke-width="14"/><rect x="1000" y="480" width="40" height="45" rx="4" fill="#087d96"/><rect x="80" y="590" width="1080" height="280" rx="18" fill="#eef8f2"/><circle cx="140" cy="650" r="30" fill="#087d96"/><text x="130" y="660" style="fill:white;font-size:28px">2</text><text x="195" y="655" font-size="28">Mojamos un poco la brocha.</text><text x="195" y="697" font-size="28">La sacamos sin derramar. No bebemos el agua.</text><path d="M850 730h110l-10 90h-90Z" fill="white" stroke="#087d96" stroke-width="4"/><path d="M858 770h94l-6 45h-82Z" fill="#b9e7ef"/><path d="M1020 720v70" stroke="#a06e42" stroke-width="14"/><rect x="1000" y="785" width="40" height="45" rx="4" fill="#087d96"/><rect x="80" y="895" width="1080" height="280" rx="18" fill="#fff8e7"/><circle cx="140" cy="955" r="30" fill="#087d96"/><text x="130" y="965" style="fill:white;font-size:28px">3</text><text x="195" y="960" font-size="28">Dibujamos sobre el cartón.</text><text x="195" y="1002" font-size="28">Elegimos qué marcas queremos hacer.</text><rect x="815" y="1030" width="280" height="110" rx="6" fill="#405c70"/><path d="M840 1100q45-70 90-10t110-10" fill="none" stroke="#b9e7ef" stroke-width="10"/><rect x="80" y="1200" width="1080" height="280" rx="18" fill="#f5effc"/><circle cx="140" cy="1260" r="30" fill="#087d96"/><text x="130" y="1270" style="fill:white;font-size:28px">4</text><text x="195" y="1265" font-size="28">Miramos y volvemos a probar.</text><text x="195" y="1307" font-size="28">¿Qué pasó con las marcas después de un rato?</text><rect x="815" y="1335" width="280" height="110" rx="6" fill="#405c70"/><path d="M840 1405q45-70 90-10t110-10" fill="none" stroke="#6d8da0" stroke-width="10"/><text x="80" y="1585" font-size="24">Para la docente: consulta el texto con los niños; no es una prueba de lectura.</text><text x="80" y="1623" font-size="24">Protege el suelo y acompaña el uso de agua.</text><text x="80" y="1690" class="small">Recurso original Ayni · La ficha acompaña el juego; no reemplaza la experiencia.</text></svg>