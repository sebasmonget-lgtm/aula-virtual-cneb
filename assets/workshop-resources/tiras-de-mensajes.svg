<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754"><rect width="1240" height="1754" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172b52}.title{font-size:48px;font-weight:700}.body{font-size:30px}.small{font-size:23px}</style><text x="80" y="105" class="title">Mensajes para alguien especial</text><text x="80" y="155" class="small">Ayni Aula · Recurso para explorar y conversar</text><text x="80" y="220" font-size="28">Escribe a tu manera. Puedes usar tus propias marcas y letras.</text><text x="80" y="262" font-size="28">Cuenta para quién es tu mensaje y qué quieres comunicar.</text><rect x="80" y="330" width="1080" height="370" rx="18" fill="#edf7fa" stroke="#93aab9" stroke-dasharray="8 8"/><text x="115" y="395" font-size="28">Para: ___________________________</text><rect x="80" y="750" width="1080" height="370" rx="18" fill="#eef8f2" stroke="#93aab9" stroke-dasharray="8 8"/><text x="115" y="815" font-size="28">Para: ___________________________</text><rect x="80" y="1170" width="1080" height="370" rx="18" fill="#f5effc" stroke="#93aab9" stroke-dasharray="8 8"/><text x="115" y="1235" font-size="28">Para: ___________________________</text><text x="80" y="1600" font-size="24">Para la docente: acepta la escritura propia; no pidas copiar un modelo.</text><text x="80" y="1638" font-size="24">Anota su explicación aparte, con permiso, sin escribir encima de su texto.</text><text x="80" y="1690" class="small">Recurso original Ayni · La ficha acompaña el juego; no reemplaza la experiencia.</text></svg>