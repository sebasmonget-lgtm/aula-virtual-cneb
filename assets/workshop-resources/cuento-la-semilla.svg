<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754"><rect width="1240" height="1754" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172b52}.title{font-size:48px;font-weight:700}.body{font-size:30px}.small{font-size:23px}</style><text x="80" y="105" class="title">La semilla de Lila</text><text x="80" y="155" class="small">Ayni Aula · Recurso para explorar y conversar</text><text x="80" y="215" font-size="27">Un cuento original de Ayni para leer en compañía.</text><rect x="80" y="275" width="1080" height="385" rx="20" fill="#fff8e7"/><text x="115" y="340" font-size="28" font-weight="700">1</text><text x="115" y="400" font-size="31">Lila encontró una semilla en el patio.</text><text x="115" y="445" font-size="31">Era pequeña y estaba seca.</text><text x="115" y="490" font-size="31">—¿Qué habrá dentro? —preguntó.</text><text x="115" y="535" font-size="31">La puso en una maceta con tierra.</text><path d="M960 525h120l-15 90h-90Z" fill="#bd6940"/><ellipse cx="1020" cy="525" rx="62" ry="17" fill="#71452f"/><ellipse cx="1020" cy="493" rx="13" ry="20" fill="#885829"/><rect x="80" y="700" width="1080" height="385" rx="20" fill="#eaf7f5"/><text x="115" y="765" font-size="28" font-weight="700">2</text><text x="115" y="825" font-size="31">Cada mañana, Lila miraba la tierra.</text><text x="115" y="870" font-size="31">Le daba un poco de agua y esperaba.</text><text x="115" y="915" font-size="31">Un día tuvo ganas de desenterrarla.</text><text x="115" y="960" font-size="31">—Esperaré un poquito más —decidió.</text><path d="M960 950h120l-15 90h-90Z" fill="#bd6940"/><ellipse cx="1020" cy="950" rx="62" ry="17" fill="#71452f"/><path d="M1020 850v55m-25-20 25 20 25-20" fill="none" stroke="#07809a" stroke-width="9"/><rect x="80" y="1125" width="1080" height="385" rx="20" fill="#edf3ff"/><text x="115" y="1190" font-size="28" font-weight="700">3</text><text x="115" y="1250" font-size="31">Al volver, vio un brote asomarse.</text><text x="115" y="1295" font-size="31">—¡La semilla estaba creciendo! —dijo.</text><text x="115" y="1340" font-size="31">Lila acercó la maceta a la luz.</text><text x="115" y="1385" font-size="31">¿Qué crees que mirará mañana?</text><path d="M960 1375h120l-15 90h-90Z" fill="#bd6940"/><ellipse cx="1020" cy="1375" rx="62" ry="17" fill="#71452f"/><path d="M1020 1375v-90" stroke="#358145" stroke-width="9"/><ellipse cx="1001" cy="1302" rx="28" ry="13" transform="rotate(35 1001 1302)" fill="#5caa60"/><ellipse cx="1040" cy="1292" rx="28" ry="13" transform="rotate(-35 1040 1292)" fill="#5caa60"/><text x="80" y="1600" font-size="24">Para la docente: lee sin adelantar el final. Vuelvan a las pistas del cuento.</text><text x="80" y="1638" font-size="24">Los niños pueden señalar, conversar o dibujar; no es una prueba de lectura.</text><text x="80" y="1690" class="small">Recurso original Ayni · La ficha acompaña el juego; no reemplaza la experiencia.</text></svg>